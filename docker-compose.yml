version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: battery_inventory_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: battery_inventory
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/src/main/resources/schema.sql:/docker-entrypoint-initdb.d/1-schema.sql
      - ./backend/src/main/resources/data.sql:/docker-entrypoint-initdb.d/2-data.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Spring Boot Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: battery_backend
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/battery_inventory
      DB_USER: postgres
      DB_PASSWORD: postgres
      JWT_SECRET: battery-dashboard-secret-key-min-32-chars-long
      CORS_ALLOWED_ORIGINS: http://localhost:4200
      PYTHON_SERVICE_URL: http://python-logic:5000
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # Python Service
  python-logic:
    build:
      context: ./python-logic
      dockerfile: Dockerfile
    container_name: battery_python
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/battery_inventory
      BACKEND_URL: http://backend:8080
      FLASK_ENV: development
    ports:
      - "5000:5000"
    depends_on:
      - postgres
    restart: unless-stopped

  # Angular Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: battery_frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
