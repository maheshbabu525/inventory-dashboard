# Database
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/battery_inventory}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Run schema.sql/data.sql against external DB (Postgres) too, after Hibernate creates the schema
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true

# JWT
jwt.secret=${JWT_SECRET:battery-dashboard-secret-key-min-32-chars-long}
jwt.expiration=86400000

# Server
server.port=${SERVER_PORT:8080}

# CORS
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200}
